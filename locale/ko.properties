mod_manager/help_open = 이 화면의 조작 방법 보기
mod_manager/help_close = 도움말 닫기
mod_manager/help_mods_title = 모드
mod_manager/help_mods_body = 이 장치에 설치된 모드 목록입니다. 헤더의 검색 상자로 이름을 찾고, 새로 고침 버튼으로 카탈로그를 다시 읽습니다. 방금 설치한 모드도 새로 고치면 바로 목록에 나타납니다. 모드 카드를 클릭하면 설명, 버전, 동작이 있는 페이지가 열립니다. 각 카드의 스위치는 그 모드를 사용하는 게임에서 모드를 켜거나 끕니다. 꺼진 모드는 파일을 유지하지만 불러오지 않습니다. 꺼진 모드의 장면과 콘텐츠는 다시 켤 때까지 실행 중인 게임에서 사라지지만, 저장 파일은 언제나 유지됩니다.
mod_manager/help_mod_page_title = 모드 페이지
mod_manager/help_mod_page_body = 이 페이지는 하나의 모드를 자세히 보여 줍니다. 설명, 제작자, 버전, 의존성 목록입니다. 여기서 현재 게임에 대한 모드를 켜거나 끌 수 있고, 모드가 장면을 제공하면 그 장면을 바로 열 수도 있습니다. 설명 아래 링크는 그 모드가 속한 컬렉션으로 이동합니다. 뒤로 버튼과 Escape는 모드 목록으로 돌아갑니다. 모드의 켜기·끄기 상태는 게임과 함께 저장되어 다시 시작 후에도 유지되므로 매번 다시 정할 필요가 없습니다. 같은 파일을 가진 모드가 둘이면 어느 쪽이 이기는지도 페이지가 알려 줍니다.
mod_manager/help_collections_title = 컬렉션
mod_manager/help_collections_body = 컬렉션 탭에는 게임 컬렉션이 표시됩니다. 별개의 게임처럼 즐기는 모드 묶음입니다. 각 카드에는 표지, 제목, 컬렉션에 포함된 모드가 나옵니다. 카드를 클릭해 컬렉션을 열고, 구성 버튼으로 구성 편집기를 엽니다. 컬렉션을 설치하면 필요한 모드를 함께 가져옵니다. 컬렉션을 제거해도 저장 파일은 지워지지 않습니다. 게임 데이터는 잠들어 기다렸다가 컬렉션이 돌아오면 함께 돌아옵니다.
mod_manager/help_scheme_title = 구성 편집기
mod_manager/help_scheme_body = 구성 편집기는 컬렉션의 구성을 바꿉니다. 어떤 모드가 게임에 참여하고 어떤 순서로 불러오는지 여기서 정합니다. 체크 상자로 모드를 추가하거나 빼고, 행을 끌어서 불러오기 순서를 바꿉니다. 같은 파일을 가진 모드는 나중에 불러오는 쪽이 이깁니다. 저장하기 전에 구성을 검사하고 빠진 의존성을 경고합니다. 변경 사항은 다음 게임 시작에 적용됩니다. 저장 파일은 그대로 유지되고, 없는 모드의 데이터는 모드가 돌아올 때까지 잠듭니다.
mod_manager/sort_tooltip = 목록 정렬: 이름, 제작자, 설치 상태 기준.
mod_manager/filters_reset_tooltip = 모든 필터와 검색 상자를 기본값으로 되돌립니다.
mod_manager/collection_json_tooltip = 구성을 원본 JSON로 엽니다. 보고, 편집하고, 다시 적용할 수 있습니다.
mod_manager/collection_reset_tooltip = 저장하지 않은 구성 변경을 모두 버립니다.
mod_manager/collection_game_tooltip = 편집 중인 구성을 다른 컬렉션으로 바꿉니다.
mod_manager/collection_plan_tooltip = 플랜을 엽니다: 적용 시 무엇을 설치하고 켜는지.
mod_manager/collection_problems_tooltip = 문제 목록을 엽니다: 빠진 모드, 버전 차이, 충돌.
