mod_manager/filters_reset_tooltip = 把所有筛选条件和搜索框恢复为默认值。
mod_manager/collection_json_tooltip = 以原始 JSON 打开结构：查看、编辑后再应用回去。
mod_manager/collection_reset_tooltip = 放弃所有未保存的结构修改。
mod_manager/collection_game_tooltip = 把正在编辑的结构切换到另一个合集。
mod_manager/collection_plan_tooltip = 打开计划：应用时会安装和启用哪些模组。
mod_manager/collection_problems_tooltip = 打开问题列表：缺失的模组、版本差距和冲突。
