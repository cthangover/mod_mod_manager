mod_manager/help_mods_title = 模组
mod_manager/help_mods_body = 这里是已安装到这台设备上的全部模组的列表。顶部的搜索框可以按名称快速查找模组，旁边的刷新按钮会重新读取目录，刚安装的模组会立刻出现。点击任意模组卡片即可打开它的页面，查看描述、版本和可以执行的操作。每张卡片上的开关决定使用该模组的游戏是否加载它；停用的模组会保留自己的文件，但不会进入游戏。被停用模组的场景和内容会从正在运行的游戏中消失，直到你重新启用它为止，你的存档数据始终保留。列表为空时先刷新目录；如果模组只属于某个游戏，切换游戏后它会出现在对应的列表里。
mod_manager/help_mod_page_title = 模组页面
mod_manager/help_mod_page_body = 这个页面详细展示一个模组：描述、作者、版本，以及它依赖的其他模组。在这里可以把模组对当前的游戏启用或停用，如果模组提供了场景，也可以直接打开这些场景。描述下方的链接会跳转到包含这个模组的合集。返回按钮和 Esc 键带你回到模组列表；模组的开关状态会和游戏一起保存，重启之后依然保持不变，不需要每次重新设置。如果两个模组带有同一个文件，页面会告诉你哪一方生效。如果你只是想试用一个模组，可以在这里看完它的依赖，再去合集中决定是否安装，避免装上互相冲突的内容。
mod_manager/help_collections_title = 合集
mod_manager/help_collections_body = 合集标签页列出游戏的合集：合集是一组打包好的模组，玩起来就像一款独立的游戏。每张卡片显示封面、标题，以及这个合集包含的模组。点击卡片即可打开合集，使用“配置”按钮可以打开它的结构编辑器。安装合集会把它需要的模组一并取回来；移除合集绝不会删除你的存档——游戏的数据只是安静等待，合集回来时会随之恢复，你不会丢失任何东西。合集的封面上还标有它的类别和来源，安装之前可以先把几个合集对比一下，再决定要玩哪一个；找不到想要的合集时，先用刷新按钮更新目录再来查看。
mod_manager/help_scheme_title = 结构编辑器
mod_manager/help_scheme_body = 结构编辑器修改合集的内容：哪些模组参与这个游戏，以及它们按什么顺序加载。勾选或取消勾选可以添加或移除模组，拖动行可以改变加载顺序——当两个模组带有同一个文件时，后加载的会覆盖先加载的，页面上会用提示标出这样的覆盖关系。保存之前编辑器会检查结构，并对缺失的依赖提出警告，照着提示补齐即可。更改在下次启动游戏时生效；你的存档保留不动，缺失模组的数据会休眠，等模组回来时一并恢复。对结构没有把握时，先不要改动游戏自带的合集，复制一份再做试验更安全。
