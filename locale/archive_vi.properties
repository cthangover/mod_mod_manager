mod_manager/archive_password=Mật khẩu tệp nén
mod_manager/archive_password_tip=Mở gói ZIP/7z bị khóa hoặc xóa mật khẩu đã lưu.
mod_manager/archive_password_hint=Chọn gói và nhập mật khẩu. Theo mặc định, mật khẩu chỉ được giữ đến khi đóng game. Sau khi xác minh, mod sẽ xuất hiện mà không cần khởi động lại.
mod_manager/archive_path=Đường dẫn đến tệp .7z đã cài
mod_manager/archive_secret=Mật khẩu
mod_manager/archive_browse=Chọn tệp nén…
mod_manager/archive_save=Mở gói
mod_manager/archive_forget=Xóa mật khẩu
mod_manager/archive_checking=Đang kiểm tra gói…
mod_manager/archive_saved=Đã lưu mật khẩu.
mod_manager/archive_failed=Không mở được gói. Hãy kiểm tra mật khẩu và tính toàn vẹn của tệp nén. Các mod hiện tại không thay đổi.
mod_manager/archive_forgotten=Đã xóa mật khẩu đã lưu. Các tài nguyên đã mở vẫn truy cập được cho đến khi mod được gỡ khỏi bộ nhớ.
mod_manager/archive_remember=Lưu mật khẩu trên thiết bị này
mod_manager/archive_remember_tip=Lưu mật khẩu dưới dạng văn bản thuần trong tệp archive_passwords.json trên thiết bị. Nếu không chọn, mật khẩu chỉ được giữ trong bộ nhớ của game.
mod_manager/archive_none=Chưa có mod dạng tệp nén không truy cập được hoặc đã mở. Hãy đặt tệp ZIP/7z vào thư mục mod.
mod_manager/archive_unlocked=Đã mở và nhận diện gói mà không cần khởi động lại game.
mod_manager/archive_reload_failed=Mật khẩu được chấp nhận nhưng chưa cập nhật được bộ mod. Game hiện tại được giữ nguyên; hãy kiểm tra phụ thuộc và lỗi biên dịch.
mod_manager/archive_locked_description=Không truy cập được gói cục bộ này. Hãy nhập mật khẩu hoặc thử lại sau khi kiểm tra tệp nén.
mod_manager/action_unlock_archive=Mở gói…
mod_manager/status_password_required=Cần mật khẩu
mod_manager/status_archive_error=Không truy cập được tệp nén
mod_manager/archive_download_hint=Gói được mã hóa hoặc mật khẩu không đúng. Hãy nhập mật khẩu để cài đặt. Mật khẩu chỉ dùng cho thao tác này và không được lưu. Đóng cửa sổ để hủy cài đặt.
