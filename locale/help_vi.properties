# Mod manager help
mod_manager/help_close = Đóng trợ giúp
mod_manager/help_mods_title = Mod
mod_manager/help_mods_body = Danh sách mod đã cài trên thiết bị này. Dùng ô tìm kiếm ở phần đầu để tìm theo tên và nút làm mới để tải lại danh mục. Sau khi làm mới, các mod vừa cài cũng xuất hiện trong danh sách. Nhấn vào thẻ mod để mở mô tả, phiên bản và các thao tác. Công tắc trên mỗi thẻ bật hoặc tắt mod trong những game sử dụng nó. Mod bị tắt vẫn giữ tệp trên ổ đĩa nhưng không được nạp. Cảnh và nội dung của mod biến mất khỏi game đang chạy cho đến khi được bật lại; dữ liệu lưu luôn được giữ nguyên.
mod_manager/help_mod_page_title = Trang mod
mod_manager/help_mod_page_body = Trang này trình bày chi tiết một mod: mô tả, tác giả, phiên bản và phụ thuộc. Tại đây bạn có thể bật hoặc tắt mod cho game hiện tại và mở trực tiếp các cảnh do mod cung cấp. Liên kết bên dưới mô tả dẫn đến các bộ sưu tập chứa mod này. Nút quay lại và phím Escape đưa bạn về danh sách mod. Trạng thái bật hoặc tắt được lưu cùng game và giữ nguyên sau khi khởi động lại. Nếu hai mod có cùng tệp, trang cũng cho biết mod nào được ưu tiên.
mod_manager/help_collections_title = Bộ sưu tập
mod_manager/help_collections_body = Thẻ Bộ sưu tập liệt kê các nhóm mod được chơi như những game riêng biệt. Mỗi thẻ hiển thị ảnh bìa, tiêu đề và các mod trong bộ sưu tập. Nhấn thẻ để mở bộ sưu tập hoặc nút cấu hình để mở trình sửa sơ đồ. Khi cài bộ sưu tập, các mod cần thiết được tải cùng nhau. Xóa bộ sưu tập không xóa dữ liệu lưu. Dữ liệu game được giữ ở trạng thái ngủ và trở lại khi bộ sưu tập được khôi phục.
mod_manager/help_scheme_title = Trình sửa sơ đồ
mod_manager/help_scheme_body = Trình sửa sơ đồ thay đổi thành phần bộ sưu tập: những mod tham gia game và thứ tự nạp của chúng. Dùng ô chọn để thêm hoặc bỏ mod, kéo các hàng để đổi thứ tự nạp. Khi các mod có cùng tệp, mod nạp sau được ưu tiên. Sơ đồ được kiểm tra trước khi lưu và các phụ thuộc còn thiếu sẽ được thông báo. Thay đổi có hiệu lực ở lần khởi chạy game tiếp theo. Dữ liệu lưu vẫn nguyên vẹn; dữ liệu của mod còn thiếu được giữ ở trạng thái ngủ cho đến khi mod trở lại.
