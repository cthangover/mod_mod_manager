# Private catalog publishing
mod_manager/publish_button = Publicar mod
mod_manager/publish_title = Publicar en un catálogo privado
mod_manager/publish_server = Servidor del catálogo
mod_manager/publish_section = Sección del catálogo
mod_manager/publish_identity = Autor de la publicación: {0} ({1})
mod_manager/publish_no_servers = Primero añade y activa un catálogo privado con una clave de acceso en Catálogos.
mod_manager/publish_checking = Comprobando los permisos de publicación…
mod_manager/publish_ready = Tu clave permite publicar mods nuevos y actualizar los mods de este autor. Los identificadores de mods de otros autores están protegidos.
mod_manager/publish_uploading = Preparando y subiendo el mod…
mod_manager/publish_success = Mod publicado. El catálogo se está actualizando.
mod_manager/publish_denied = Esta clave no permite publicar: es de solo lectura, está revocada, ha caducado o no permite acceder a la sección seleccionada.
mod_manager/publish_conflict = Este identificador de mod está reservado para otro autor o sección. Elige otro identificador para un mod nuevo o usa la clave del propietario.
mod_manager/publish_too_large = El archivo supera el límite de tamaño de subida de este servidor.
mod_manager/publish_unsupported = Este servidor de catálogo no permite publicar mods.
mod_manager/publish_rate_limit = El servidor ha limitado temporalmente las solicitudes. Inténtalo más tarde.
mod_manager/publish_failed = No se pudo publicar. Comprueba la conexión, la versión y el paquete del mod, y vuelve a intentarlo.
mod_manager/publish_admin_ready = Clave de administrador: acceso a todas las secciones, creación de secciones y actualización de cualquier mod conservando su propietario.
mod_manager/publish_section_created = Sección creada. Ya puedes publicar un mod en ella.
mod_manager/publish_create_section = Crear sección
mod_manager/publish_section_name = Sección nueva u otra sección permitida
mod_manager/publish_storage_failed = El mod está publicado, pero no se pudo guardar en su carpeta de almacenamiento. Pide al administrador que compruebe el registro del servidor y los permisos de escritura.
mod_manager/publish_mod_limit = Este autor ya tiene el número máximo de mods en este servidor. Actualiza uno de tus mods o contacta con el administrador del catálogo.
mod_manager/publish_progress = Subiendo el mod: {0}%
mod_manager/publish_reconnecting = Conexión perdida al {0}%. Reconectando (intento {1}); se conserva lo ya enviado…
mod_manager/publish_connection = Sin conexión con el servidor: no se ha podido enviar ni un byte durante varios minutos. Publica el mod de nuevo; si no ha cambiado, la subida continuará desde donde se interrumpió.

# Author consent
mod_manager/publish_consent_required = Para publicar se necesita el consentimiento aparte del autor del mod. Lee la redacción vigente y marca la casilla de consentimiento.
mod_manager/publish_consent_accept = Doy mi consentimiento para el tratamiento de los datos personales del autor del mod en los términos expuestos
mod_manager/publish_consent_accept_link = Doy mi consentimiento para el tratamiento de los datos personales del autor del mod según el consentimiento del enlace (redacción {0})
mod_manager/publish_consent_website = Abrir en el sitio web
mod_manager/publish_consent_language = El consentimiento está en ruso; el texto ruso es el que tiene validez jurídica.
mod_manager/publish_consent_language_native = El consentimiento se muestra en español; el texto ruso es el que tiene validez jurídica.
