# Mod manager help
mod_manager/help_close = Close help
mod_manager/help_mods_title = Mods
mod_manager/help_mods_body = The list of mods installed on this device. Use the search field in the header to find a mod by name and Refresh to reload the catalog. Refresh also makes newly installed mods appear in the list. Click a mod card to open its description, versions and actions. Each card's switch enables or disables the mod in games that use it. Disabled mods stay on disk but are not loaded. Their scenes and content disappear from the running game until you enable them again; saves are always kept.
mod_manager/help_mod_page_title = Mod page
mod_manager/help_mod_page_body = This page shows one mod in detail: its description, author, versions and dependencies. Here you can enable or disable the mod for the current game and, if it provides scenes, open them directly. Links below the description lead to collections that include the mod. Back and Escape return to the mod list. The enabled state is saved with the game and survives restarts. If two mods contain the same files, this page also tells you which one takes precedence.
mod_manager/help_collections_title = Collections
mod_manager/help_collections_body = The Collections tab lists game collections: mod sets played as separate games. Each card shows a cover, title and the collection's mods. Click a card to open the collection or Configure to open its scheme editor. Installing a collection fetches the required mods together. Removing a collection does not delete saves. Its game data stays dormant and returns when the collection is restored.
mod_manager/help_scheme_title = Scheme editor
mod_manager/help_scheme_body = The scheme editor changes a collection's contents: which mods join the game and their load order. Use checkboxes to add or remove mods, and drag rows to change the load order. When mods contain the same files, the one loaded later takes precedence. The scheme is checked before saving and missing dependencies are reported. Changes apply on the next game launch. Saves stay intact, and data belonging to missing mods stays dormant until those mods return.
