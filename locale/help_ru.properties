# Mod manager help
mod_manager/help_close = Закрыть справку
mod_manager/help_mods_title = Моды
mod_manager/help_mods_body = Список модов, установленных на этом устройстве. Поле поиска в заголовке находит мод по имени, кнопка обновления заново загружает каталог. После обновления в списке появляются и только что установленные моды. Нажмите на карточку мода, чтобы открыть описание, версии и действия. Переключатель на каждой карточке включает или отключает мод в играх, которые его используют. Отключённый мод остаётся на диске, но не загружается. Его сцены и содержимое исчезают из запущенной игры до повторного включения; сохранения всегда остаются.
mod_manager/help_mod_page_title = Страница мода
mod_manager/help_mod_page_body = На этой странице подробно показан один мод: описание, автор, версии и зависимости. Здесь можно включить или отключить мод для текущей игры, а если он содержит сцены — открыть их напрямую. Ссылки под описанием ведут к коллекциям, в которые входит мод. Кнопка «Назад» и Escape возвращают к списку модов. Состояние включения сохраняется вместе с игрой и после перезапуска. Если два мода содержат одинаковые файлы, страница также показывает, какой из них имеет приоритет.
mod_manager/help_collections_title = Коллекции
mod_manager/help_collections_body = Вкладка «Коллекции» показывает игровые коллекции — наборы модов, в которые играют как в отдельные игры. На каждой карточке видны обложка, название и моды коллекции. Нажмите на карточку, чтобы открыть коллекцию, или на кнопку настройки, чтобы открыть редактор схемы. При установке коллекции необходимые моды загружаются вместе. Удаление коллекции не удаляет сохранения. Данные игры остаются в неактивном состоянии и возвращаются при восстановлении коллекции.
mod_manager/help_scheme_title = Редактор схемы
mod_manager/help_scheme_body = Редактор схемы меняет состав коллекции: какие моды участвуют в игре и в каком порядке загружаются. Добавляйте и исключайте моды флажками, меняйте порядок загрузки перетаскиванием строк. Если моды содержат одинаковые файлы, приоритет получает загруженный позже. Перед сохранением схема проверяется, а недостающие зависимости отмечаются. Изменения применяются при следующем запуске игры. Сохранения остаются целыми, а данные отсутствующих модов хранятся в неактивном состоянии до возвращения этих модов.
