# Private catalog publishing
mod_manager/publish_button = 发布模组
mod_manager/publish_title = 发布到私有目录
mod_manager/publish_server = 目录服务器
mod_manager/publish_section = 目录分区
mod_manager/publish_identity = 发布者：{0}（{1}）
mod_manager/publish_no_servers = 请先在“目录”中添加并启用带有访问密钥的私有目录。
mod_manager/publish_checking = 正在检查发布权限…
mod_manager/publish_ready = 此密钥允许发布新模组并更新此作者拥有的模组。其他作者的模组 ID 受到保护。
mod_manager/publish_uploading = 正在打包并上传模组…
mod_manager/publish_success = 模组已发布，正在刷新目录。
mod_manager/publish_denied = 此密钥不允许发布：它可能为只读、已撤销、已过期，或无权访问所选分区。
mod_manager/publish_conflict = 此模组 ID 已保留给其他作者或分区。发布新模组时请选择其他 ID，更新现有模组则需要所有者的密钥。
mod_manager/publish_too_large = 压缩包超过了此服务器的上传大小限制。
mod_manager/publish_unsupported = 此目录服务器不支持发布模组。
mod_manager/publish_rate_limit = 服务器暂时限制了请求，请稍后重试。
mod_manager/publish_failed = 发布失败。请检查连接、模组版本和安装包后重试。
mod_manager/publish_admin_ready = 管理员密钥：可访问所有分区、创建分区，以及在保留所有者的情况下更新任何模组。
mod_manager/publish_section_created = 分区已创建，可以向其中发布模组。
mod_manager/publish_create_section = 创建分区
mod_manager/publish_section_name = 新分区或其他有权访问的分区
mod_manager/publish_storage_failed = 模组已在目录中发布，但无法保存到存储文件夹。请联系管理员检查服务器日志和写入权限。
mod_manager/publish_mod_limit = 此作者在服务器上拥有的模组数已达上限。请更新已有模组，或联系目录管理员。
mod_manager/publish_progress = 正在上传模组：{0}%
mod_manager/publish_reconnecting = 连接在 {0}% 时中断。正在重新连接（第 {1} 次尝试），已发送的数据会保留…
mod_manager/publish_connection = 无法连接服务器：已连续数分钟未能发送任何字节。请重新发布模组；如果内容未变，上传将从中断处继续。

# Author consent
mod_manager/publish_consent_required = 发布模组需要单独的模组作者同意书。请阅读现行文本并勾选同意框。
mod_manager/publish_consent_accept = 我同意按所述条款处理模组作者的个人数据
mod_manager/publish_consent_accept_link = 我同意按链接所指同意书（{0} 版）的条款处理模组作者的个人数据
mod_manager/publish_consent_website = 在网站上打开
mod_manager/publish_consent_language = 同意书为俄文文本；以俄文文本为准。
mod_manager/publish_consent_language_native = 同意书以中文显示；以俄文文本为准。
