# Private catalog publishing
mod_manager/publish_button = MODを公開
mod_manager/publish_title = 非公開カタログに公開
mod_manager/publish_server = カタログサーバー
mod_manager/publish_section = カタログのセクション
mod_manager/publish_identity = 公開者：{0}（{1}）
mod_manager/publish_no_servers = まず「カタログ」でアクセスキー付きの非公開カタログを追加し、有効にしてください。
mod_manager/publish_checking = 公開権限を確認中…
mod_manager/publish_ready = このキーでは新しいMODの公開と、この作者が所有するMODの更新ができます。他の作者のMOD IDは保護されています。
mod_manager/publish_uploading = MODをパッケージ化してアップロード中…
mod_manager/publish_success = MODを公開しました。カタログを更新中です。
mod_manager/publish_denied = このキーでは公開できません。読み取り専用、失効済み、有効期限切れ、または選択したセクションへのアクセス権がありません。
mod_manager/publish_conflict = このMOD IDは別の作者またはセクション用に予約されています。新しいMODには別のIDを選び、更新には所有者のキーを使用してください。
mod_manager/publish_too_large = アーカイブがこのサーバーのアップロード容量制限を超えています。
mod_manager/publish_unsupported = このカタログサーバーはMODの公開に対応していません。
mod_manager/publish_rate_limit = サーバーがリクエストを一時的に制限しています。しばらくしてから再試行してください。
mod_manager/publish_failed = 公開できませんでした。接続、MODのバージョンとパッケージを確認して再試行してください。
mod_manager/publish_admin_ready = 管理者キー：すべてのセクションへのアクセス、セクションの作成、所有者を維持したまま任意のMODを更新できます。
mod_manager/publish_section_created = セクションを作成しました。ここにMODを公開できます。
mod_manager/publish_create_section = セクションを作成
mod_manager/publish_section_name = 新規または他の許可されたセクション
mod_manager/publish_storage_failed = MODは公開されましたが、ストレージフォルダーに保存できませんでした。管理者にサーバーログと書き込み権限の確認を依頼してください。
mod_manager/publish_mod_limit = この作者がサーバー上に所有できるMOD数の上限に達しています。既存のMODを更新するか、カタログ管理者に連絡してください。
mod_manager/publish_progress = MODをアップロード中：{0}%
mod_manager/publish_reconnecting = {0}%で接続が切れました。再接続中（{1}回目）。送信済みのデータは保持されます…
mod_manager/publish_connection = サーバーに接続できず、数分間データをまったく送信できていません。もう一度MODを公開してください。内容が変わっていなければ、中断した位置からアップロードを再開します。
