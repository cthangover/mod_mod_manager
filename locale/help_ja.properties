# Mod manager help
mod_manager/help_close = ヘルプを閉じる
mod_manager/help_mods_title = MOD
mod_manager/help_mods_body = この端末にインストールされたMODの一覧です。上部の検索欄で名前を検索し、更新ボタンでカタログを読み直します。新しくインストールしたMODも更新すると一覧に表示されます。カードをクリックすると、説明、バージョン、操作を確認できます。各カードのスイッチで、そのMODを使うゲーム内での有効・無効を切り替えます。無効なMODはファイルが残りますが、読み込まれません。再び有効にするまで、そのシーンやコンテンツは実行中のゲームから消えます。セーブデータは常に保持されます。
mod_manager/help_mod_page_title = MODページ
mod_manager/help_mod_page_body = このページでは、ひとつのMODの説明、作者、バージョン、依存関係を詳しく確認できます。現在のゲームでMODを有効・無効にしたり、MODが提供するシーンを直接開いたりできます。説明の下のリンクは、そのMODを含むコレクションに移動します。戻るボタンとEscapeキーでMOD一覧に戻ります。有効・無効の状態はゲームとともに保存され、再起動後も維持されます。複数のMODに同じファイルがある場合は、どちらが優先されるかも表示されます。
mod_manager/help_collections_title = コレクション
mod_manager/help_collections_body = コレクションタブには、独立したゲームとして遊べるMODの組み合わせが表示されます。各カードには表紙、タイトル、含まれるMODが表示されます。カードをクリックするとコレクションを開き、設定ボタンで構成エディターを開けます。コレクションをインストールすると、必要なMODがまとめて取得されます。コレクションを削除してもセーブデータは消えません。ゲームデータは休眠状態で保持され、コレクションを復元すると再び使えるようになります。
mod_manager/help_scheme_title = 構成エディター
mod_manager/help_scheme_body = 構成エディターでは、ゲームに参加するMODと読み込み順を変更できます。チェックボックスでMODを追加・除外し、行をドラッグして読み込み順を変えます。同じファイルを含むMODでは、後に読み込まれたものが優先されます。保存前に構成が検証され、不足する依存関係が通知されます。変更は次回のゲーム起動時に適用されます。セーブデータは保持され、不在のMODのデータはそのMODが戻るまで休眠状態で保存されます。
