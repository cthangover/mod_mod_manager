# Private catalog publishing
mod_manager/publish_button = Publish mod
mod_manager/publish_title = Publish to a private catalog
mod_manager/publish_server = Catalog server
mod_manager/publish_section = Catalog section
mod_manager/publish_identity = Publisher: {0} ({1})
mod_manager/publish_no_servers = Add and enable a private catalog with an access key in Catalogs first.
mod_manager/publish_checking = Checking publishing permissions…
mod_manager/publish_ready = Your key can publish new packages and update packages owned by this publisher. Mod and collection IDs have separate owners.
mod_manager/publish_uploading = Preparing and uploading the package…
mod_manager/publish_success = Published. The catalog is being refreshed.
mod_manager/publish_denied = This key cannot publish: it is read-only, revoked, expired, or does not allow the selected section.
mod_manager/publish_conflict = This ID is reserved for another author or section. Choose another ID or use the owner’s key.
mod_manager/publish_too_large = The archive exceeds this server’s upload size limit.
mod_manager/publish_unsupported = This catalog server does not support publishing.
mod_manager/publish_rate_limit = The server has temporarily limited requests. Try again later.
mod_manager/publish_failed = Publishing failed. Check the connection, version and package, then try again.
mod_manager/publish_admin_ready = Administrator key: all sections, section creation and package updates, preserving ownership.
mod_manager/publish_section_created = Section created. You can publish to it.
mod_manager/publish_create_section = Create section
mod_manager/publish_section_name = New or another permitted section
mod_manager/publish_storage_failed = Published, but the storage folder could not be saved. Ask the administrator to check the server log and write permissions.
mod_manager/publish_mod_limit = This author has reached the entity limit (100 mods or 100 collections, counted separately). Update an existing package or contact the catalog administrator.
mod_manager/publish_author_name = This author nickname is already used by another catalog author. Ask the catalog owner to issue a key with a different nickname.
mod_manager/publish_progress = Uploading: {0}%
mod_manager/publish_reconnecting = Connection lost at {0}%. Reconnecting (attempt {1}); what was sent is kept…
mod_manager/publish_connection = No connection to the server: no bytes got through for several minutes. Publish again; an unchanged package resumes where it stopped.

mod_manager/publish_consent_required = Publishing requires separate mod author consent. Read the current revision and check the consent box.
mod_manager/publish_consent_accept = I consent to the processing of the mod author’s personal data under the stated terms
mod_manager/publish_consent_accept_link = I consent to the processing of the mod author’s personal data under the consent linked above (revision {0})
mod_manager/publish_consent_website = Open on website
mod_manager/publish_consent_language = The consent is in Russian; the Russian text is binding.
mod_manager/publish_consent_language_native = The consent is shown in English; the Russian text is binding.

mod_manager/publish_no_key = No access key is configured for this server. Enter an author key in Catalogs.

mod_manager/publish_server_disabled = This catalog is disabled. Enable it in Catalogs to publish.

mod_manager/publish_no_sections = This author key grants no publishing sections. Ask the server owner to issue a key with a section or section mask.

mod_manager/publish_unavailable = Cannot check this server. Check its address, the key file and the connection.
