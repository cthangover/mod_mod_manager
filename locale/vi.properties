mod_manager/help_close = Đóng trợ giúp
mod_manager/help_mods_title = Mod
mod_manager/help_mods_body = Đây là danh sách mod đã cài trên thiết bị này. Dùng ô tìm kiếm ở đầu trang để tìm mod theo tên, và nút làm mới để đọc lại danh mục — mod mới cài sẽ xuất hiện ngay. Nhấp vào thẻ mod để mở trang của nó với mô tả, phiên bản và các thao tác. Công tắc trên mỗi thẻ bật hoặc tắt mod cho những trò chơi dùng nó; mod bị tắt vẫn giữ tệp nhưng không được nạp. Cảnh và nội dung của mod bị tắt biến mất khỏi trò chơi đang chạy cho tới khi bạn bật lại, còn bản lưu của bạn vẫn được giữ.
mod_manager/help_mod_page_title = Trang mod
mod_manager/help_mod_page_body = Trang này hiển thị chi tiết một mod: mô tả, tác giả, phiên bản và danh sách phụ thuộc. Từ đây bạn có thể bật hoặc tắt mod cho các trò chơi hiện tại, và mở các cảnh của mod nếu nó có cung cấp. Các liên kết dưới phần mô tả dẫn tới những bộ sưu tập có chứa mod này. Nút quay lại và Escape đưa bạn về danh sách mod; trạng thái bật/tắt của mod được lưu cùng trò chơi và giữ nguyên sau khi khởi động lại, nên không cần đặt lại mỗi lần. Nếu hai mod đều có cùng một tệp, trang sẽ cho biết tệp của mod nào thắng.
mod_manager/help_collections_title = Bộ sưu tập
mod_manager/help_collections_body = Thẻ bộ sưu tập liệt kê các bộ sưu tập trò chơi: những gói mod sẵn sàng chơi như những trò chơi riêng biệt. Mỗi thẻ hiển thị ảnh bìa, tên và các mod mà bộ sưu tập gồm có. Nhấp vào thẻ để mở bộ sưu tập, dùng nút Cấu hình để mở trình sửa sơ đồ của nó. Cài đặt bộ sưu tập sẽ tải các mod nó cần; gỡ bỏ không bao giờ xoá bản lưu của bạn — dữ liệu trò chơi ngủ đông và quay lại cùng với bộ sưu tập.
mod_manager/help_scheme_title = Trình sửa sơ đồ
mod_manager/help_scheme_body = Trình sửa sơ đồ thay đổi nội dung của bộ sưu tập: mod nào tham gia trò chơi và theo thứ tự nạp nào. Bật tắt các ô chọn để thêm hoặc bỏ mod, kéo các hàng để đổi thứ tự nạp — khi hai mod đều có cùng một tệp, mod nạp sau sẽ thắng. Trước khi lưu, trình sửa sơ đồ kiểm tra sơ đồ và cảnh báo về phụ thuộc còn thiếu. Thay đổi có hiệu lực ở lần khởi động trò chơi kế tiếp; bản lưu của bạn được giữ lại, dữ liệu của các mod vắng mặt ngủ cho tới khi mod trở lại.
mod_manager/sort_tooltip = Sắp xếp danh sách: theo tên, tác giả hoặc trạng thái cài đặt.
mod_manager/filters_reset_tooltip = Đưa mọi bộ lọc và ô tìm kiếm về mặc định.
mod_manager/collection_json_tooltip = Mở sơ đồ dưới dạng JSON thô: xem, sửa rồi áp dụng lại.
mod_manager/collection_reset_tooltip = Bỏ mọi thay đổi chưa lưu của sơ đồ.
mod_manager/collection_game_tooltip = Chuyển sơ đồ đang sửa sang bộ sưu tập khác.
mod_manager/collection_plan_tooltip = Mở kế hoạch: việc áp dụng sẽ cài và bật những gì.
mod_manager/collection_problems_tooltip = Mở danh sách vấn đề: mod còn thiếu, khác phiên bản và xung đột.
