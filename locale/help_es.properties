# Mod manager help
mod_manager/help_close = Cerrar ayuda
mod_manager/help_mods_title = Mods
mod_manager/help_mods_body = La lista de mods instalados en este dispositivo. Usa el buscador de la cabecera para encontrar un mod por su nombre y Actualizar para volver a cargar el catálogo. Al actualizar también aparecen los mods recién instalados. Haz clic en una tarjeta para ver su descripción, versiones y acciones. El interruptor de cada tarjeta activa o desactiva el mod en los juegos que lo utilizan. Los mods desactivados permanecen en el disco, pero no se cargan. Sus escenas y contenido desaparecen de la partida actual hasta que los actives de nuevo; las partidas guardadas siempre se conservan.
mod_manager/help_mod_page_title = Página del mod
mod_manager/help_mod_page_body = Esta página muestra un mod en detalle: descripción, autor, versiones y dependencias. Aquí puedes activar o desactivar el mod para el juego actual y, si incluye escenas, abrirlas directamente. Los enlaces bajo la descripción llevan a las colecciones que incluyen el mod. Volver y Escape te devuelven a la lista. El estado de activación se guarda con el juego y se conserva al reiniciar. Si dos mods contienen los mismos archivos, la página también indica cuál tiene prioridad.
mod_manager/help_collections_title = Colecciones
mod_manager/help_collections_body = La pestaña Colecciones muestra conjuntos de mods que se juegan como juegos independientes. Cada tarjeta incluye portada, título y mods de la colección. Haz clic en una tarjeta para abrir la colección o en Configurar para abrir el editor de esquemas. Al instalar una colección se descargan juntos los mods necesarios. Eliminar una colección no borra las partidas guardadas. Sus datos quedan inactivos y vuelven cuando se restaura la colección.
mod_manager/help_scheme_title = Editor de esquemas
mod_manager/help_scheme_body = El editor de esquemas cambia el contenido de una colección: qué mods participan en el juego y su orden de carga. Usa las casillas para añadir o quitar mods y arrastra las filas para cambiar el orden. Cuando dos mods contienen los mismos archivos, tiene prioridad el que se carga después. Antes de guardar se comprueba el esquema y se avisa de las dependencias que faltan. Los cambios se aplican al iniciar el juego de nuevo. Las partidas guardadas se conservan y los datos de mods ausentes quedan inactivos hasta que regresen.
