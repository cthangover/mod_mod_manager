# Private catalog publishing
mod_manager/publish_button = Опубликовать мод
mod_manager/publish_title = Публикация в приватном каталоге
mod_manager/publish_server = Сервер каталога
mod_manager/publish_section = Раздел каталога
mod_manager/publish_identity = Автор публикации: {0} ({1})
mod_manager/publish_no_servers = Сначала добавьте и включите приватный каталог с ключом доступа в окне «Каталоги».
mod_manager/publish_checking = Проверяем право публикации…
mod_manager/publish_ready = Ключ разрешает новые публикации и обновления этого автора. Владельцы ID модов и коллекций учитываются отдельно.
mod_manager/publish_uploading = Упаковка и загрузка…
mod_manager/publish_success = Опубликовано. Каталог обновляется.
mod_manager/publish_denied = Ключ не разрешает публикацию: он выдан только для чтения, отозван, истёк или не даёт доступа к выбранному разделу.
mod_manager/publish_conflict = Этот ID закреплён за другим автором или разделом. Выберите другой ID или используйте ключ владельца.
mod_manager/publish_too_large = Архив превышает допустимый для этого сервера размер загрузки.
mod_manager/publish_unsupported = Этот сервер каталога не поддерживает публикацию модов.
mod_manager/publish_rate_limit = Сервер временно ограничил запросы. Повторите позже.
mod_manager/publish_failed = Публикация не удалась. Проверьте соединение, версию и пакет, затем повторите.
mod_manager/publish_admin_ready = Ключ администратора: все разделы, создание разделов и обновление пакетов с сохранением владельца.
mod_manager/publish_section_created = Раздел создан. Можно публиковать.
mod_manager/publish_create_section = Создать раздел
mod_manager/publish_section_name = Новый или другой разрешённый раздел
mod_manager/publish_storage_failed = Опубликовано, но папку хранилища сохранить не удалось. Попросите администратора проверить журнал и права записи.
mod_manager/publish_mod_limit = Достигнут лимит автора: 100 модов или 100 коллекций, учитываемых отдельно. Обновите существующий пакет или обратитесь к владельцу каталога.
mod_manager/publish_author_name = Этот ник автора уже занят другим автором каталога. Попросите владельца каталога выпустить ключ с другим ником.
mod_manager/publish_progress = Загрузка: {0}%
mod_manager/publish_reconnecting = Связь прервалась на {0}%. Переподключаемся (попытка {1}); уже переданное не потеряется…
mod_manager/publish_connection = Нет связи с сервером: несколько минут не передано ни байта. Повторите публикацию; неизменённый пакет продолжит загрузку с прежнего места.

mod_manager/publish_consent_required = Для публикации необходимо отдельное согласие автора мода. Ознакомьтесь с текущей редакцией и отметьте согласие.
mod_manager/publish_consent_accept = Я даю согласие на обработку персональных данных автора мода на изложенных условиях
mod_manager/publish_consent_accept_link = Я даю согласие на обработку персональных данных автора мода на условиях согласия по ссылке (редакция {0})
mod_manager/publish_consent_website = Открыть на сайте
mod_manager/publish_consent_language = Согласие составлено на русском языке; юридическую силу имеет русский текст.
mod_manager/publish_consent_language_native = Согласие составлено на русском языке; юридическую силу имеет русский текст.

mod_manager/publish_no_key = Для сервера не задан ключ. Введите ключ автора в окне «Каталоги».

mod_manager/publish_server_disabled = Каталог выключен. Включите его в окне «Каталоги», чтобы опубликовать мод.

mod_manager/publish_no_sections = У ключа автора нет разделов для публикации. Попросите владельца сервера выдать ключ с разделом или маской разделов.

mod_manager/publish_unavailable = Не удалось проверить сервер. Проверьте адрес, файл ключа и соединение.
