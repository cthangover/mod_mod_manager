# Private catalog publishing
mod_manager/publish_button = Опубликовать мод
mod_manager/publish_title = Публикация в приватном каталоге
mod_manager/publish_server = Сервер каталога
mod_manager/publish_section = Раздел каталога
mod_manager/publish_identity = Автор публикации: {0} ({1})
mod_manager/publish_no_servers = Сначала добавьте и включите приватный каталог с ключом доступа в окне «Каталоги».
mod_manager/publish_checking = Проверяем право публикации…
mod_manager/publish_ready = Ключ разрешает загрузку новых модов и обновление модов этого автора. ID чужих модов защищены от перезаписи.
mod_manager/publish_uploading = Упаковка и загрузка мода…
mod_manager/publish_success = Мод опубликован. Каталог обновляется.
mod_manager/publish_denied = Ключ не разрешает публикацию: он выдан только для чтения, отозван, истёк или не даёт доступа к выбранному разделу.
mod_manager/publish_conflict = ID мода закреплён за другим автором или разделом. Для нового мода выберите другой ID; для обновления нужен ключ владельца.
mod_manager/publish_too_large = Архив превышает допустимый для этого сервера размер загрузки.
mod_manager/publish_unsupported = Этот сервер каталога не поддерживает публикацию модов.
mod_manager/publish_rate_limit = Сервер временно ограничил запросы. Повторите позже.
mod_manager/publish_failed = Не удалось опубликовать мод. Проверьте соединение, версию и пакет мода, затем повторите.
mod_manager/publish_admin_ready = Ключ администратора: все разделы, создание разделов и обновление любых модов с сохранением владельца.
mod_manager/publish_section_created = Раздел создан. В него можно опубликовать мод.
mod_manager/publish_create_section = Создать раздел
mod_manager/publish_section_name = Новый или другой разрешённый раздел
mod_manager/publish_storage_failed = Мод опубликован в каталоге, но не сохранён в папках хранилища. Администратору нужно проверить журнал сервера и права записи.
mod_manager/publish_mod_limit = У этого автора уже максимальное число модов на сервере. Обновите один из своих модов или обратитесь к администратору каталога.
mod_manager/publish_progress = Загрузка мода: {0}%
mod_manager/publish_reconnecting = Связь прервалась на {0}%. Переподключаемся (попытка {1}); уже переданное не потеряется…
mod_manager/publish_connection = Нет связи с сервером: несколько минут не удалось передать ни байта. Опубликуйте мод снова — если он не менялся, загрузка продолжится с того же места.
