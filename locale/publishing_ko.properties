# Private catalog publishing
mod_manager/publish_button = 모드 게시
mod_manager/publish_title = 비공개 카탈로그에 게시
mod_manager/publish_server = 카탈로그 서버
mod_manager/publish_section = 카탈로그 섹션
mod_manager/publish_identity = 게시자: {0} ({1})
mod_manager/publish_no_servers = 먼저 카탈로그에서 접근 키가 있는 비공개 카탈로그를 추가하고 활성화하세요.
mod_manager/publish_checking = 게시 권한 확인 중…
mod_manager/publish_ready = 이 키로 새 모드를 게시하고 이 제작자가 소유한 모드를 업데이트할 수 있습니다. 다른 제작자의 모드 ID는 보호됩니다.
mod_manager/publish_uploading = 모드를 패키징하고 업로드하는 중…
mod_manager/publish_success = 모드를 게시했습니다. 카탈로그를 새로 고치는 중입니다.
mod_manager/publish_denied = 이 키로는 게시할 수 없습니다. 읽기 전용이거나, 취소 또는 만료되었거나, 선택한 섹션에 대한 권한이 없습니다.
mod_manager/publish_conflict = 이 모드 ID는 다른 제작자나 섹션에 할당되어 있습니다. 새 모드에는 다른 ID를 선택하고, 기존 모드를 업데이트하려면 소유자의 키를 사용하세요.
mod_manager/publish_too_large = 압축 파일이 이 서버의 업로드 크기 제한을 초과합니다.
mod_manager/publish_unsupported = 이 카탈로그 서버는 모드 게시를 지원하지 않습니다.
mod_manager/publish_rate_limit = 서버가 요청을 일시적으로 제한했습니다. 나중에 다시 시도하세요.
mod_manager/publish_failed = 게시하지 못했습니다. 연결, 모드 버전과 패키지를 확인한 후 다시 시도하세요.
mod_manager/publish_admin_ready = 관리자 키: 모든 섹션 접근, 섹션 생성, 소유자를 유지한 채 모든 모드 업데이트가 가능합니다.
mod_manager/publish_section_created = 섹션을 만들었습니다. 이제 여기에 모드를 게시할 수 있습니다.
mod_manager/publish_create_section = 섹션 만들기
mod_manager/publish_section_name = 새 섹션 또는 접근이 허용된 다른 섹션
mod_manager/publish_storage_failed = 모드는 게시되었지만 저장소 폴더에 저장하지 못했습니다. 관리자에게 서버 로그와 쓰기 권한 확인을 요청하세요.
mod_manager/publish_mod_limit = 이 제작자가 서버에서 소유할 수 있는 모드 수의 상한에 도달했습니다. 기존 모드 중 하나를 업데이트하거나 카탈로그 관리자에게 문의하세요.
mod_manager/publish_progress = 모드 업로드 중: {0}%
mod_manager/publish_reconnecting = {0}%에서 연결이 끊겼습니다. 다시 연결하는 중({1}번째 시도)이며, 이미 전송한 데이터는 유지됩니다…
mod_manager/publish_connection = 서버에 연결되지 않아 몇 분 동안 단 한 바이트도 전송하지 못했습니다. 모드를 다시 게시하세요. 내용이 바뀌지 않았다면 중단된 지점부터 업로드가 이어집니다.
