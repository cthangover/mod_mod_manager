# Mod manager help
mod_manager/help_close = 关闭帮助
mod_manager/help_mods_title = 模组
mod_manager/help_mods_body = 此处列出本设备上安装的模组。使用顶部搜索框按名称查找模组，点击刷新按钮重新加载目录。刷新后，新安装的模组也会立即出现在列表中。点击模组卡片可查看说明、版本和可用操作。每张卡片的开关可在使用该模组的游戏中启用或禁用它。禁用的模组会保留文件，但不会加载。在重新启用前，其场景和内容会从正在运行的游戏中消失；存档始终保留。
mod_manager/help_mod_page_title = 模组页面
mod_manager/help_mod_page_body = 此页面详细展示单个模组的说明、作者、版本和依赖项。你可以在此为当前游戏启用或禁用模组；如果模组提供场景，也可以直接打开。说明下方的链接通往包含该模组的合集。返回按钮和 Escape 键可回到模组列表。启用状态会随游戏保存，重启后仍然保留。如果两个模组包含相同的文件，页面还会说明哪个模组优先。
mod_manager/help_collections_title = 合集
mod_manager/help_collections_body = “合集”选项卡列出可作为独立游戏游玩的模组组合。每张卡片展示封面、名称和合集所包含的模组。点击卡片可打开合集，点击配置按钮可打开方案编辑器。安装合集时，会一并获取所需模组。移除合集不会删除存档。游戏数据会保留为休眠状态，并在合集恢复后重新可用。
mod_manager/help_scheme_title = 方案编辑器
mod_manager/help_scheme_body = 方案编辑器用于更改合集的组成：哪些模组参与游戏，以及它们的加载顺序。使用复选框添加或移除模组，拖动行来调整加载顺序。如果模组包含相同文件，后加载的模组优先。保存前会检查方案，并提示缺失的依赖项。更改在下次启动游戏时生效。存档保持完整，缺失模组的数据会保留为休眠状态，直到这些模组恢复。
