# Private catalog publishing
mod_manager/publish_button = Đăng mod
mod_manager/publish_title = Đăng lên danh mục riêng tư
mod_manager/publish_server = Máy chủ danh mục
mod_manager/publish_section = Mục trong danh mục
mod_manager/publish_identity = Người đăng: {0} ({1})
mod_manager/publish_no_servers = Trước tiên, hãy thêm và bật danh mục riêng tư có khóa truy cập trong cửa sổ Danh mục.
mod_manager/publish_checking = Đang kiểm tra quyền đăng…
mod_manager/publish_ready = Khóa này cho phép đăng mod mới và cập nhật các mod thuộc tác giả này. Mã mod của tác giả khác được bảo vệ.
mod_manager/publish_uploading = Đang đóng gói và tải mod lên…
mod_manager/publish_success = Đã đăng mod. Đang làm mới danh mục.
mod_manager/publish_denied = Khóa này không cho phép đăng: chỉ có quyền đọc, đã bị thu hồi, đã hết hạn hoặc không cho phép truy cập mục đã chọn.
mod_manager/publish_conflict = Mã mod này đã được dành cho tác giả hoặc mục khác. Hãy chọn mã khác cho mod mới hoặc dùng khóa của chủ sở hữu để cập nhật.
mod_manager/publish_too_large = Tệp nén vượt quá giới hạn kích thước tải lên của máy chủ này.
mod_manager/publish_unsupported = Máy chủ danh mục này không hỗ trợ đăng mod.
mod_manager/publish_rate_limit = Máy chủ tạm thời giới hạn yêu cầu. Hãy thử lại sau.
mod_manager/publish_failed = Không đăng được mod. Hãy kiểm tra kết nối, phiên bản và gói mod rồi thử lại.
mod_manager/publish_admin_ready = Khóa quản trị viên: truy cập mọi mục, tạo mục và cập nhật bất kỳ mod nào mà vẫn giữ nguyên chủ sở hữu.
mod_manager/publish_section_created = Đã tạo mục. Bạn có thể đăng mod vào đó.
mod_manager/publish_create_section = Tạo mục
mod_manager/publish_section_name = Mục mới hoặc mục khác được phép truy cập
mod_manager/publish_storage_failed = Mod đã được đăng nhưng không thể lưu vào thư mục lưu trữ. Hãy nhờ quản trị viên kiểm tra nhật ký máy chủ và quyền ghi.
mod_manager/publish_mod_limit = Tác giả này đã sở hữu số mod tối đa trên máy chủ. Hãy cập nhật một mod hiện có hoặc liên hệ quản trị viên danh mục.
mod_manager/publish_progress = Đang tải mod lên: {0}%
mod_manager/publish_reconnecting = Mất kết nối ở {0}%. Đang kết nối lại (lần thử {1}); dữ liệu đã gửi được giữ lại…
mod_manager/publish_connection = Không kết nối được với máy chủ: đã vài phút không gửi được byte nào. Hãy đăng mod lại; nếu nội dung không thay đổi, quá trình tải lên sẽ tiếp tục từ chỗ bị ngắt.
